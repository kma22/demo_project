name: demo_project
description: "Flutter demo project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  provider: ^6.1.4

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+4

  # Navigation
  auto_route: ^11.1.0

  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.9.1

  # Data & Serialization
  json_annotation: ^4.10.0
  uuid: ^4.5.2

  #Logger
  talker: ^5.1.13
  talker_dio_logger: ^5.1.13
  talker_flutter: ^5.1.13
  google_fonts: ^8.0.0
  skeletonizer: ^2.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.12.2
  injectable_generator: ^2.11.1
  auto_route_generator: ^10.4.0
  drift_dev: ^2.30.1
  json_serializable: ^6.12.0
  flutter_gen_runner: ^5.12.0
  bloc_test: ^10.0.0
  mockito: ^5.6.3

flutter_gen:
  output: lib/core/gen/
  line_length: 100

  integrations:
    flutter_svg: true
    rive: false
    lottie: false

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/ui_kit/images/body_states/

